# Deploy the web build to Cloudflare Pages on every push to main.
# Same deploy path as `pnpm deploy:web` (scripts/deploy-web.sh) — the script
# reads credentials from the environment, so CI only needs the two repo
# secrets below. One-time setup:
#   gh secret set CLOUDFLARE_API_TOKEN   (token with Account > Cloudflare Pages > Edit)
#   gh secret set CLOUDFLARE_ACCOUNT_ID
name: Deploy Web

on:
  push:
    branches: [main]
    # Android-only changes (tauri config, kotlin, rust) don't affect the web
    # bundle; version bumps always touch package.json so releases still deploy.
    paths-ignore:
      - 'src-tauri/**'
      - 'docs/**'
      - '**/*.md'
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Call the same script as local deploys; wrangler is invoked directly
        # (not via wrangler-action) to avoid its known pnpm incompatibilities.
        run: bash scripts/deploy-web.sh
